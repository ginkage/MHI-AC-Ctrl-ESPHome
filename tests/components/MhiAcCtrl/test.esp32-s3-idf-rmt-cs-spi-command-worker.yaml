esphome:
  name: mhi-s3-rmt-cs-spi-cw
  friendly_name: MHI ESP32-S3 RMT-CS SPI Command Worker Compile Test

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: mhi-compile-test
  password: compile-test-password

api:

external_components:
  - source:
      type: local
      path: ../../../components
    components: [MhiAcCtrl]

MhiAcCtrl:
  id: mhi_ac
  frame_size: 33
  sck_pin: 8
  mosi_pin: 38
  miso_pin: 39
  rx_driver: rmt_cs_spi
  rmt_spi_frame_gap_us: 1000
  command_worker: true
  command_worker_start_delay_ms: 0
  opdata_freshness_timeout: 120s
  external_temperature_sensor: external_room_temp
  external_temperature_fallback_on_homeassistant_disconnect: true
  external_temperature_disconnect_grace_period: 15s
  power_estimation:
    nominal_voltage: 230.0
    voltage_sensor: test_mains_voltage
    voltage_timeout: 5min
    power_factor_sensor: test_power_factor
    power_factor_timeout: 5min
    power_factor: 0.95
    standby_power: 5.0
    max_sample_interval: 5min

climate:
  - platform: MhiAcCtrl
    mhi_ac_ctrl_id: mhi_ac
    name: MHI Climate
    setpoint_step: 0.5


switch:
  - platform: MhiAcCtrl
    mhi_ac_ctrl_id: mhi_ac
    active_mode:
      name: MHI Active Mode
    outdoor_unit_silent_mode:
      name: MHI Outdoor Unit Silent Mode


binary_sensor:
  - platform: MhiAcCtrl
    mhi_ac_ctrl_id: mhi_ac
    opdata_fresh:
      name: MHI Opdata Fresh

sensor:
  - platform: homeassistant
    id: external_room_temp
    entity_id: sensor.compile_test_room_temperature
  - platform: template
    id: test_mains_voltage
    internal: true
    lambda: return 240.0;
    update_interval: 30s
  - platform: template
    id: test_power_factor
    internal: true
    lambda: return 0.92;
    update_interval: 30s
  - platform: MhiAcCtrl
    mhi_ac_ctrl_id: mhi_ac
    opdata_oldest_age:
      name: MHI Opdata Oldest Age
    opdata_stale_count:
      name: MHI Opdata Stale Count
    opdata_timeout_events:
      name: MHI Opdata Timeout Events
    estimated_power:
      name: MHI Estimated Power
    estimated_energy:
      name: MHI Estimated Energy
