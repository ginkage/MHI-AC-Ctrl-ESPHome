substitutions:
  device_name: mhi-ac-ctrl
  friendly_name: MHI Air Conditioner

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.3.0
  name_add_mac_suffix: false

esp32:
  board: esp32-s3-devkitc-1  # Change to match your ESP32 board
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/Astute4185/MHI-AC-Ctrl-ESPHome_ESP-IDF
      ref: master
    components: [MhiAcCtrl]

MhiAcCtrl:
  id: mhi_ac
  # Set to 20 for older units.
  # Set to 33 for newer WF-RAC compatible units that expose 3D Auto and left/right vanes.
  # If you see checksum/signature failures, verify frame_size first.
  frame_size: 33
  # Update these pins to match your hardware.
  sck_pin: 14
  mosi_pin: 13
  miso_pin: 12
  # Preferred hardware-assisted full-duplex path for ESP32-S3.
  # rmt_cs_spi owns both RX and TX; do not configure tx_driver.
  rx_driver: rmt_cs_spi
  command_worker: true
  external_temperature_sensor: room_temperature_sensor
  # Fall back to the indoor-unit sensor if Home Assistant itself disconnects.
  external_temperature_fallback_on_homeassistant_disconnect: true
  # Defaults to 60s; transient HA/API disconnects inside this window keep the override.
  external_temperature_disconnect_grace_period: 60s
  # Applies to manual climate.mhi.set_external_room_temperature actions.
  room_temp_timeout: 60

climate:
  - platform: MhiAcCtrl
    mhi_ac_ctrl_id: mhi_ac
    name: "${friendly_name}"

sensor:
  - platform: homeassistant
    id: room_temperature_sensor
    entity_id: sensor.temperature_sensor_your_room_temperature

select:
  - platform: MhiAcCtrl
    mhi_ac_ctrl_id: mhi_ac
    vertical_vanes:
      name: "Vanes Up-Down"
    horizontal_vanes:
      name: "Vanes Left-Right"

switch:
  - platform: MhiAcCtrl
    mhi_ac_ctrl_id: mhi_ac
    vanes_3d_auto:
      name: "3D Auto"
